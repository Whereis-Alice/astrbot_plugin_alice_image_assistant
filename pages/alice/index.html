<div class="shell" id="shell">
  <header class="appbar">
    <a class="brand" href="#/overview" title="爱丽丝的图片助手">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" class="brand-glyph"><circle cx="10.4" cy="10.4" r="5.6"/><path d="m14.8 14.8 4.4 4.4"/><path d="M10.4 6.6v7.6M6.6 10.4h7.6"/></svg>
      </span>
      <span class="brand-text">
        <strong id="brand-title">爱丽丝的图片助手</strong>
        <small id="brand-sub">找图 · 溯源 · Pixiv · VLM 复核</small>
      </span>
    </a>

    <div class="appbar-actions">
      <div class="theme-picker">
        <button class="pill-btn" id="btn-theme" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="切换界面主题">
          <span class="swatches" id="theme-swatch" aria-hidden="true"></span>
          <span id="theme-label">奇境</span>
          <svg class="icon sm" aria-hidden="true"><use href="#i-caret"></use></svg>
        </button>
        <div class="theme-menu" id="theme-menu" role="menu" aria-label="界面主题" hidden></div>
      </div>
      <button class="pill-btn" id="btn-compact" type="button" aria-pressed="false" aria-label="紧凑模式">
        <svg class="icon sm" aria-hidden="true"><use href="#i-compact"></use></svg><span>紧凑</span>
      </button>
      <button class="pill-btn" id="btn-refresh" type="button" aria-label="重新载入后端数据">
        <svg class="icon sm" aria-hidden="true"><use href="#i-refresh"></use></svg><span>刷新</span>
      </button>
      <button class="pill-btn danger" id="btn-reset" type="button" aria-label="重置界面偏好">
        <svg class="icon sm" aria-hidden="true"><use href="#i-undo"></use></svg><span id="reset-label">重置偏好</span>
      </button>
    </div>
  </header>

  <nav class="tabbar" id="tabbar" role="tablist" aria-label="主导航"></nav>

  <main class="views" id="views">
    <section class="view" data-view="overview" role="tabpanel" aria-labelledby="tab-overview" tabindex="-1" hidden></section>
    <section class="view" data-view="search" role="tabpanel" aria-labelledby="tab-search" tabindex="-1" hidden></section>
    <section class="view" data-view="reverse" role="tabpanel" aria-labelledby="tab-reverse" tabindex="-1" hidden></section>
    <section class="view" data-view="config" role="tabpanel" aria-labelledby="tab-config" tabindex="-1" hidden></section>
    <section class="view" data-view="commands" role="tabpanel" aria-labelledby="tab-commands" tabindex="-1" hidden></section>
    <section class="view" data-view="about" role="tabpanel" aria-labelledby="tab-about" tabindex="-1" hidden></section>
  </main>

  <footer class="statusbar">
    <span class="status-left" id="status-left"></span>
    <span class="status-right" id="status-right"></span>
  </footer>
</div>

<div class="boot" id="boot">
  <span class="boot-mark" aria-hidden="true">
    <svg viewBox="0 0 24 24" class="brand-glyph"><circle cx="10.4" cy="10.4" r="5.6"/><path d="m14.8 14.8 4.4 4.4"/><path d="M10.4 6.6v7.6M6.6 10.4h7.6"/></svg>
  </span>
  <p id="boot-text">正在连接 AstrBot…</p>
  <div class="boot-bar" aria-hidden="true"><i></i></div>
</div>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="图片预览" hidden>
  <button class="icon-btn lightbox-close" id="lightbox-close" type="button" aria-label="关闭预览">
    <svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>
  </button>
  <figure class="lightbox-figure">
    <img id="lightbox-img" alt="预览图" />
    <figcaption id="lightbox-cap"></figcaption>
  </figure>
</div>

<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

<script type="module" src="./app.js"></script>
</body>
</html>
